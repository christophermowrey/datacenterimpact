services:
  web:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GEOCODER_PROVIDER: mock
      NEXT_PUBLIC_MAP_STYLE_URL: ""
      GOOGLE_MAPS_API_KEY: ""
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: data_center_impact
      POSTGRES_USER: data_center_impact
      POSTGRES_PASSWORD: change-me
    volumes:
      - data-center-impact-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_center_impact -d data_center_impact"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  data-center-impact-db:
