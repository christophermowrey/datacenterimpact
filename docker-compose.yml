services:
  web:
    restart: unless-stopped
    build:
      context: .
      args:
        NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
        NEXT_PUBLIC_USE_OSM_FALLBACK: ${NEXT_PUBLIC_USE_OSM_FALLBACK:-false}
        NEXT_PUBLIC_OSM_TILE_URL: ${NEXT_PUBLIC_OSM_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
        NEXT_PUBLIC_SHOW_CANDIDATES: ${NEXT_PUBLIC_SHOW_CANDIDATES:-false}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GEOCODER_PROVIDER: ${GEOCODER_PROVIDER:-nominatim}
      NEXT_PUBLIC_MAP_STYLE_URL: ${NEXT_PUBLIC_MAP_STYLE_URL:-}
      NEXT_PUBLIC_USE_OSM_FALLBACK: ${NEXT_PUBLIC_USE_OSM_FALLBACK:-false}
      NEXT_PUBLIC_OSM_TILE_URL: ${NEXT_PUBLIC_OSM_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
      NEXT_PUBLIC_SHOW_CANDIDATES: ${NEXT_PUBLIC_SHOW_CANDIDATES:-false}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      ADMIN_ENABLED: ${ADMIN_ENABLED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      DATABASE_URL: ${DATABASE_URL:-}
      STORAGE_PATH: ${STORAGE_PATH:-/app}
      ADMIN_UPTIME_URL: ${ADMIN_UPTIME_URL:-}
      ADMIN_COSTS_URL: ${ADMIN_COSTS_URL:-}
      ADMIN_METRICS_URL: ${ADMIN_METRICS_URL:-}
    depends_on:
      db:
        condition: service_healthy
  db:
    restart: unless-stopped
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: data_center_impact
      POSTGRES_USER: data_center_impact
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.local or the shell environment}
    volumes:
      - data-center-impact-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U data_center_impact -d data_center_impact"]
      interval: 5s
      timeout: 5s
      retries: 10
  caddy:
    image: caddy:2.10-alpine
    profiles: ["production"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-datacenterimpact.app}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin.datacenterimpact.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
volumes:
  data-center-impact-db:

  caddy-data:

  caddy-config:
